name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64   # newest installed Visual Studio

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit and analysis tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate plugin with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs "build\VokalAssistent_artefacts\Release\VST3\Vokal Assistent.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse "build\VokalAssistent_artefacts\Release\VST3\Vokal Assistent.vst3" package\
          Copy-Item docs\INSTALL.txt package\

      - uses: actions/upload-artifact@v4
        with:
          name: Vokal-Assistent-Windows-VST3
          path: package

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs-windows
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath Vokal-Assistent-${{ github.ref_name }}-Windows-VST3.zip
          gh release create ${{ github.ref_name }} Vokal-Assistent-${{ github.ref_name }}-Windows-VST3.zip --title "Vokal Assistent ${{ github.ref_name }}" --notes "Windows VST3. See INSTALL.txt inside the zip."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux build, tests and pluginval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb ninja-build

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Unit and analysis tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate plugin with pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "build/VokalAssistent_artefacts/Release/VST3/Vokal Assistent.vst3"
